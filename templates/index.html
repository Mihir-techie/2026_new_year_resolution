<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resolution Planner 2026 | Transform Your Year</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI Resolution Planner 2026</h1>
            <p>Discover your personalized New Year resolution powered by AI</p>
        </div>

        <div class="card">
            <form action="/predict" method="post" id="resolutionForm">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120" required placeholder="Enter your age">
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select your gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sleep">Sleep Duration (hours)</label>
                    <div class="range-container">
                        <input type="range" id="sleep" name="sleep" min="4" max="12" step="0.1" value="7" required>
                        <span class="range-value">7</span>
                    </div>
                    <input type="number" step="0.1" min="4" max="12" value="7" required 
                           oninput="document.getElementById('sleep').value = this.value; document.querySelector('#sleep').nextElementSibling.textContent = this.value"
                           style="margin-top: 0.5rem; width: 100%;">
                </div>

                <div class="form-group">
                    <label for="sleep_quality">Quality of Sleep (1-10)</label>
                    <div class="range-container">
                        <input type="range" id="sleep_quality" name="sleep_quality" min="1" max="10" step="1" value="5" required>
                        <span class="range-value">5</span>
                    </div>
                    <input type="number" id="sleep_quality_num" name="sleep_quality_num" min="1" max="10" value="5" required
                           oninput="document.getElementById('sleep_quality').value = this.value; document.querySelector('#sleep_quality').nextElementSibling.textContent = this.value"
                           style="margin-top: 0.5rem; width: 100%;">
                </div>

                <div class="form-group">
                    <label for="activity">Physical Activity Level (0-100)</label>
                    <div class="range-container">
                        <input type="range" id="activity" name="activity" min="0" max="100" step="1" value="50" required>
                        <span class="range-value">50</span>
                    </div>
                    <input type="number" id="activity_num" name="activity_num" min="0" max="100" value="50" required
                           oninput="document.getElementById('activity').value = this.value; document.querySelector('#activity').nextElementSibling.textContent = this.value"
                           style="margin-top: 0.5rem; width: 100%;">
                </div>

                <div class="form-group">
                    <label for="stress">Stress Level (1-10)</label>
                    <div class="range-container">
                        <input type="range" id="stress" name="stress" min="1" max="10" step="1" value="5" required>
                        <span class="range-value">5</span>
                    </div>
                    <input type="number" id="stress_num" name="stress_num" min="1" max="10" value="5" required
                           oninput="document.getElementById('stress').value = this.value; document.querySelector('#stress').nextElementSibling.textContent = this.value"
                           style="margin-top: 0.5rem; width: 100%;">
                </div>

                <div class="form-group">
                    <label for="steps">Daily Steps</label>
                    <input type="number" id="steps" name="steps" min="0" max="50000" step="100" required placeholder="Enter your daily steps">
                </div>

                <div class="form-group">
                    <label for="bmi">BMI Category</label>
                    <select id="bmi" name="bmi" required>
                        <option value="">Select BMI Category</option>
                        <option value="1">Normal (1)</option>
                        <option value="2">Overweight (2)</option>
                        <option value="3">Obese (3)</option>
                    </select>
                </div>

                <button type="submit" class="btn">Discover My 2026 Resolution</button>
            </form>

            <div class="loading">
                <div class="spinner"></div>
                <p>Analyzing your data...</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Sync range sliders with number inputs
        document.querySelectorAll('input[type="range"]').forEach(range => {
            const numInput = range.parentElement.nextElementSibling;
            if (numInput && numInput.tagName === 'INPUT') {
                range.addEventListener('input', function() {
                    numInput.value = this.value;
                });
                numInput.addEventListener('input', function() {
                    if (this.value >= range.min && this.value <= range.max) {
                        range.value = this.value;
                        range.nextElementSibling.textContent = this.value;
                    }
                });
            }
        });
    </script>
</body>
</html>
